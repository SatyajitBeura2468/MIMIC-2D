<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="861" viewBox="0 0 1440 861" role="img" aria-labelledby="title desc">
<title id="title">Mimic 2D — game screen preview</title>
<desc id="desc">A stylised recreation of the game's purple tiled home screen with gold title, house scene, sneaky lamp, inspector, and launch menu.</desc>
<defs>
 <linearGradient id="bg" x2=".9" y2="1"><stop stop-color="#5d6cdf"/><stop offset="1" stop-color="#26235d"/></linearGradient>
 <linearGradient id="cta" x2="1" y2="1"><stop stop-color="#ff5d9c"/><stop offset="1" stop-color="#ffb17e"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe45e"/><stop offset="1" stop-color="#ffb51e"/></linearGradient>
 <linearGradient id="beam" x2="1" y2="1"><stop stop-color="#fffba5" stop-opacity=".75"/><stop offset="1" stop-color="#fff9a0" stop-opacity="0"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".24"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#11103d" flood-opacity=".48"/></filter>
 <pattern id="tile" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" fill="none" stroke="#d7dcff" stroke-opacity=".11" stroke-width="2"/><rect x="2" y="2" width="86" height="86" fill="#ffffff" opacity=".022"/></pattern>
</defs>
<rect width="1440" height="861" fill="url(#bg)"/><rect width="1440" height="861" fill="url(#tile)"/>
